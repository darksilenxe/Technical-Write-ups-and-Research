<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var basePath = "/" + location.pathname.split("/").filter(Boolean)[0] + "/";
        var routePath = location.pathname.slice(basePath.length - 1);
        var target = basePath + "?p=" + encodeURIComponent(routePath + location.search + location.hash);
        location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
